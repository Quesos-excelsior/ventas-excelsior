<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B5121B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ventas Excelsior">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ventas Excelsior</title>
<style>
:root{
  --crema:#F6EFE3; --crema2:#EFE4D0; --blanco:#FFFFFF;
  --rojo:#B5121B; --rojo2:#8E0E15; --rojoSuave:#F8E3E3;
  --verde:#2E7D32; --verdeSuave:#E3F1E4;
  --tinta:#2B2420; --gris:#7A6F66; --linea:#E6DCC9;
  --radio:16px; --sombra:0 2px 10px rgba(60,40,20,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--crema);color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:contain}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translate(-50%,-60px);z-index:20;background:var(--blanco);color:var(--rojo);font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;transition:transform .18s ease,opacity .18s;opacity:0;pointer-events:none}
#ptr.show{opacity:1}
#ptr .sp{width:14px;height:14px;border:2px solid var(--rojo);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:none}
#ptr.busy .sp{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
header .updwrap{display:flex;align-items:center;gap:10px}
#btn-ref{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#btn-ref:active{background:rgba(255,255,255,.3)}
#btn-ref.girando svg{animation:spin .8s linear infinite}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{margin:0;font-weight:800}
button{font:inherit;cursor:pointer}

/* ---------- PIN ---------- */
#pin{position:fixed;inset:0;background:var(--crema);display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;z-index:50}
#pin .logo{width:min(260px,70vw);margin-bottom:8px}
#pin .sub{color:var(--gris);font-size:14px;margin:0 0 22px}
.dots{display:flex;gap:14px;margin-bottom:26px;height:18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--rojo);background:transparent;transition:background .12s}
.dots i.on{background:var(--rojo)}
.dots.err i{border-color:#C62828;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:none;background:var(--blanco);box-shadow:var(--sombra);
  font-size:28px;font-weight:600;color:var(--tinta)}
.pad button:active{background:var(--crema2)}
.pad button.soft{background:transparent;box-shadow:none;font-size:15px;color:var(--gris);font-weight:600}
#pinmsg{min-height:22px;color:#C62828;font-size:14px;margin-top:16px;font-weight:600}
label.rec{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--gris);margin-top:14px}
label.rec input{width:18px;height:18px;accent-color:var(--rojo)}

/* ---------- lista mensual ---------- */
.ml{display:flex;flex-direction:column}
.ml .hd{display:grid;grid-template-columns:1.1fr 1.3fr 1fr;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);font-weight:700;padding:0 0 8px;border-bottom:1px solid var(--linea)}
.ml .hd span:last-child{text-align:right}
.ml .m{display:grid;grid-template-columns:1.1fr 1.3fr 1fr;align-items:center;padding:10px 0;border-bottom:1px solid var(--linea);cursor:pointer}
.ml .m .n b{display:block;font-size:15px}
.ml .m .n span{font-size:11px;color:var(--gris)}
.ml .m .v b{display:block;font-size:16px}
.ml .m .v span{font-size:11px;color:var(--gris)}
.ml .m .c{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ml .m .c .delta{min-width:70px;justify-content:center;white-space:nowrap}
.ml .tot{display:grid;grid-template-columns:1.1fr 1.3fr 1fr;align-items:center;padding:12px 0 4px;border-top:2px solid var(--rojo);margin-top:2px}
.ml .tot b{font-size:16px}.ml .tot span{font-size:11px;color:var(--gris);display:block}
.ml .det{background:var(--crema);border-radius:12px;padding:12px;margin:0 0 8px}
.parcial{color:var(--verde);font-weight:800;font-size:10px}
.d2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.d2 div b{display:block;font-size:14px}
.d2 div span{font-size:10px;color:var(--gris);text-transform:uppercase;letter-spacing:.06em}
.selmes{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.selmes select{flex:1;font:inherit;font-weight:700;padding:10px 12px;border-radius:12px;border:1px solid var(--linea);background:var(--blanco);color:var(--rojo)}
.selmes button{width:40px;height:40px;border-radius:12px;border:1px solid var(--linea);background:var(--blanco);font-size:18px;color:var(--rojo)}
.ytd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ytd .kpi .v{font-size:17px}
.ytd .kpi .s{font-size:11px;color:var(--gris);margin-top:2px}

/* ---------- APP ---------- */
#app{display:none;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--rojo);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 14px;
  border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(140,10,20,.25);position:sticky;top:0;z-index:5}
header .row{display:flex;align-items:center;justify-content:space-between}
header .brand{font-weight:900;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
header .brand small{display:block;font-weight:600;font-size:11px;letter-spacing:.14em;opacity:.85}
header .upd{font-size:11px;opacity:.85;text-align:right;line-height:1.3}
main{padding:14px 14px 0;max-width:560px;margin:0 auto}
.view{display:none}.view.on{display:block}
.card{background:var(--blanco);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px;margin-bottom:12px}
.card h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gris);margin-bottom:8px}
.big{font-size:38px;font-weight:900;color:var(--rojo);line-height:1.05}
.med{font-size:22px;font-weight:800;color:var(--tinta)}
.sub{font-size:13px;color:var(--gris)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi{background:var(--crema);border-radius:12px;padding:10px 12px}
.kpi .v{font-size:19px;font-weight:800}
.kpi .l{font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.08em}
.kpi .v.verde{color:var(--verde)}
.kpi .v.rojo{color:#C62828}
.kpi .s{font-size:11px;color:var(--gris);margin-top:2px}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:14px;padding:4px 10px;border-radius:999px}
.delta.up{background:var(--verdeSuave);color:var(--verde)}
.delta.dn{background:var(--rojoSuave);color:#C62828}
.delta.eq{background:var(--crema2);color:var(--gris)}
.delta.sm{font-size:12px;padding:2px 8px}
.bar{height:10px;background:var(--crema2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--rojo);border-radius:99px}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea)}
.list li:last-child{border-bottom:none}
.list .rk{width:22px;height:22px;border-radius:50%;background:var(--crema2);color:var(--rojo2);font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex:none}
.list .nm{flex:1;min-width:0}
.list .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .nm span{font-size:12px;color:var(--gris)}
.list .amt{text-align:right;flex:none}
.list .amt b{display:block;font-size:15px}
.list .amt span{font-size:12px;color:var(--gris)}
.mini{height:6px;background:var(--crema);border-radius:99px;margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--rojo);border-radius:99px}
.seg{display:flex;background:var(--crema2);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:none;background:transparent;padding:9px 6px;border-radius:9px;font-weight:700;color:var(--gris);font-size:13px}
.seg button.on{background:var(--blanco);color:var(--rojo);box-shadow:var(--sombra)}
svg text{font-family:inherit}
.view svg{height:auto;display:block}
.prodlist .nm span{font-size:11.5px;white-space:nowrap}
.prodlist .amt{min-width:92px}
.amt .vs{display:flex;align-items:center;gap:4px;justify-content:flex-end;white-space:nowrap}
.amt .vs em{font-style:normal;font-size:11px;color:var(--gris)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--gris);margin-top:6px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--rojoSuave);border-radius:12px;padding:10px 12px;font-size:13px;color:#8E0E15;margin-top:10px}
.chip{display:inline-block;background:var(--crema);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--gris);margin:2px 4px 2px 0}
.empty{color:var(--gris);font-size:14px;text-align:center;padding:20px}
.tip{font-size:12px;color:var(--gris);margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--blanco);border-top:1px solid var(--linea);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;border:none;background:transparent;color:var(--gris);font-size:11px;font-weight:700;padding:6px 0 2px;border-radius:10px}
nav button svg{display:block;margin:0 auto 3px;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--rojo)}
#loading{position:fixed;inset:0;background:rgba(246,239,227,.92);display:none;align-items:center;justify-content:center;z-index:40;color:var(--rojo);font-weight:800}
.foot{text-align:center;color:var(--gris);font-size:11px;padding:10px 0 6px}
.foot button{background:none;border:none;color:var(--gris);text-decoration:underline;font-size:11px}
</style>
</head>
<body>

<!-- PIN -->
<div id="pin">
  <img class="logo" src="logo.png" alt="Excelsior" onerror="this.style.display='none'">
  <p class="sub">Ventas diarias · Parroli</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
  <div id="pinmsg"></div>
  <label class="rec"><input type="checkbox" id="rec" checked> Recordar en este teléfono</label>
</div>

<div id="loading">Cargando ventas…</div>

<!-- APP -->
<div id="app">
  <div id="ptr"><span class="sp"></span><span id="ptr-txt">Desliza para actualizar</span></div>
<header>
    <div class="row">
      <div class="brand">Excelsior<small>Ventas · Parroli</small></div>
      <div class="updwrap"><div class="upd" id="upd"></div><button id="btn-ref" aria-label="Actualizar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button></div>
    </div>
  </header>
  <main>
    <section class="view on" id="v-hoy"></section>
    <section class="view" id="v-mes"></section>
    <section class="view" id="v-prod"></section>
    <section class="view" id="v-cli"></section>
    <section class="view" id="v-eq"></section>
    <div class="foot">Datos de SAP Business One · <button id="salir">Cerrar sesión</button></div>
  </main>
  <nav>
    <button class="on" data-v="hoy"><svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Hoy</button>
    <button data-v="mes"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Mes</button>
    <button data-v="prod"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>Productos</button>
    <button data-v="cli"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15 15.5a5 5 0 016.5 4.5"/></svg>Clientes</button>
    <button data-v="eq"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16V9M11 16V4M16 16v-6M21 16v-3"/></svg>Equipo</button>
  </nav>
</div>

<script>
/* =========================================================
   Ventas Excelsior — app de una sola página (sin librerías)
   ========================================================= */
const ARCHIVO = 'datos.enc.json';           // generado por publicar_ventas.py
const KEY_PIN = 'vx_pin';
let D = null;

// ---------- formato ----------
const fMXN = new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const fNum = new Intl.NumberFormat('es-MX',{maximumFractionDigits:0});
const fNum1 = new Intl.NumberFormat('es-MX',{maximumFractionDigits:1,minimumFractionDigits:1});
const mxn = v => fMXN.format(v||0);
const mxnC = v => { v=v||0; const a=Math.abs(v);
  if(a>=1e6) return (v<0?'-':'')+'$'+fNum1.format(a/1e6)+' M';
  if(a>=1e4) return (v<0?'-':'')+'$'+fNum.format(a/1e3)+' k';
  return mxn(v); };
const kg = v => fNum.format(Math.round(v||0))+' kg';
const pz = v => fNum.format(Math.round(v||0))+' pz';
const pct = v => (v==null?'—':fNum1.format(v*100)+' %');
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function fecha(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d);
  return `${DIAS[dt.getDay()]} ${d} de ${MESES[m-1]}`; }
function mesNombre(ym){ const [y,m]=ym.split('-').map(Number); return `${MESES[m-1]} ${y}`; }
function delta(act, ant, {small=false, suf=''}={}){
  if(!ant) return `<span class="delta eq${small?' sm':''}">sin comparativo</span>`;
  const d=(act-ant)/Math.abs(ant); const cls=d>0.005?'up':d<-0.005?'dn':'eq';
  const arrow=cls==='up'?'▲':cls==='dn'?'▼':'●';
  return `<span class="delta ${cls}${small?' sm':''}">${arrow} ${fNum1.format(Math.abs(d)*100)} %${suf}</span>`;
}
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- cifrado (AES-GCM, clave derivada del PIN con PBKDF2) ----------
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function descifrar(pkg, pin){
  const salt=b64(pkg.salt), iv=b64(pkg.iv), ct=b64(pkg.ct);
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:pkg.iter||200000,hash:'SHA-256'}, base,
    {name:'AES-GCM',length:256}, false, ['decrypt']);
  const plano=await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(plano));
}
async function cargar(pin){
  const r=await fetch(ARCHIVO+'?t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('No se encontró el archivo de datos ('+r.status+').');
  const pkg=await r.json();
  try{ return await descifrar(pkg, pin); }
  catch(e){ const err=new Error('PIN incorrecto'); err.pin=true; throw err; }
}

// ---------- PIN ----------
let buf='';
const dots=document.getElementById('dots'), pad=document.getElementById('pad'), pinmsg=document.getElementById('pinmsg');
['1','2','3','4','5','6','7','8','9','borrar','0','ok'].forEach(k=>{
  const b=document.createElement('button');
  if(k==='borrar'){b.textContent='⌫';b.className='soft';}
  else if(k==='ok'){b.textContent='Entrar';b.className='soft';}
  else b.textContent=k;
  b.onclick=()=>tecla(k); pad.appendChild(b);
});
function pintar(){ [...dots.children].forEach((d,i)=>d.classList.toggle('on',i<buf.length)); }
function tecla(k){
  pinmsg.textContent='';
  if(k==='borrar'){buf=buf.slice(0,-1);pintar();return;}
  if(k==='ok'){ if(buf.length>=4) entrar(buf); return; }
  if(buf.length<6){buf+=k;pintar(); if(buf.length===6) entrar(buf);}
}
document.addEventListener('keydown',e=>{ if(document.getElementById('pin').style.display==='none')return;
  if(/^[0-9]$/.test(e.key)) tecla(e.key); else if(e.key==='Backspace') tecla('borrar'); else if(e.key==='Enter') tecla('ok'); });
let pinActual=null, ultimaCarga=0, refrescando=false;
async function entrar(pin){
  const load=document.getElementById('loading'); load.style.display='flex';
  try{
    D=await cargar(pin); pinActual=pin; ultimaCarga=Date.now();
    try{ if(document.getElementById('rec').checked) localStorage.setItem(KEY_PIN,pin); }catch(_){}
    document.getElementById('pin').style.display='none';
    document.getElementById('app').style.display='block';
    render();
  }catch(e){
    buf=''; pintar(); dots.classList.add('err'); setTimeout(()=>dots.classList.remove('err'),400);
    pinmsg.textContent= e.pin ? 'PIN incorrecto' : e.message;
    try{ if(e.pin) localStorage.removeItem(KEY_PIN); }catch(_){}
  } finally { load.style.display='none'; }
}
// ---------- Actualizar: deslizar, tocar "Actualizado", o al volver a la app ----------
const ptr=document.getElementById('ptr'), ptrTxt=document.getElementById('ptr-txt');
function ptrShow(txt,busy){ ptrTxt.textContent=txt; ptr.classList.toggle('busy',!!busy); ptr.classList.add('show'); ptr.style.transform='translate(-50%,0)'; }
function ptrHide(){ ptr.classList.remove('show','busy'); ptr.style.transform='translate(-50%,-60px)'; }
async function refrescar(){
  if(refrescando||!pinActual) return; refrescando=true; document.getElementById('btn-ref').classList.add('girando');
  ptrShow('Actualizando…',true);
  try{ const d=await cargar(pinActual); D=d; ultimaCarga=Date.now(); render(); ptrShow('Actualizado '+(D.generado||'').slice(11,16),false); }
  catch(e){ ptrShow(e.pin?'No se pudo descifrar':'Sin conexión, se muestran los últimos datos',false); }
  finally{ refrescando=false; document.getElementById('btn-ref').classList.remove('girando'); setTimeout(ptrHide,1400); }
}
(function pull(){
  let y0=null, dy=0, activo=false;
  document.addEventListener('touchstart',e=>{ if(document.getElementById('app').style.display!=='block'||refrescando) return; if(window.scrollY<=0){ y0=e.touches[0].clientY; dy=0; activo=true; } else activo=false; },{passive:true});
  document.addEventListener('touchmove',e=>{ if(!activo||y0===null) return; dy=e.touches[0].clientY-y0; if(dy>12){ const p=Math.min(dy,110); ptr.classList.add('show'); ptr.style.transform=`translate(-50%,${p-60}px)`; ptrTxt.textContent= dy>80 ? 'Suelta para actualizar' : 'Desliza para actualizar'; } },{passive:true});
  document.addEventListener('touchend',()=>{ if(!activo) return; activo=false; if(dy>80) refrescar(); else ptrHide(); y0=null; dy=0; },{passive:true});
  document.addEventListener('touchcancel',()=>{ activo=false; ptrHide(); },{passive:true});
})();
document.getElementById('btn-ref').onclick=refrescar;
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && pinActual && Date.now()-ultimaCarga>2*60*1000) refrescar(); });
setInterval(()=>{ if(document.visibilityState==='visible' && pinActual && Date.now()-ultimaCarga>10*60*1000) refrescar(); },60*1000);
document.getElementById('salir').onclick=()=>{ try{localStorage.removeItem(KEY_PIN);}catch(_){} location.reload(); };
(function auto(){ let p=null; try{p=localStorage.getItem(KEY_PIN);}catch(_){} if(p) entrar(p); })();

// ---------- navegación ----------
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));

let diaSel=null;
function barras(serieAct, serieAnt, {alto=170, sel=null}={}){
  // serieAct/serieAnt: [{dia, venta}]; eje x = día del mes 1..31
  const W=520, H=alto, padL=8, padR=8, padT=14, padB=22;
  const dias=31, bw=(W-padL-padR)/dias;
  const max=Math.max(1,...serieAct.map(s=>s.venta),...serieAnt.map(s=>s.venta));
  const y=v=>padT+(H-padT-padB)*(1-v/max);
  const mapAnt={}; serieAnt.forEach(s=>mapAnt[s.dia]=s.venta);
  const mapAct={}; serieAct.forEach(s=>mapAct[s.dia]=s.venta);
  let out=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" aria-label="Venta diaria">`;
  // mes anterior: barras suaves
  for(let d=1;d<=dias;d++){ const v=mapAnt[d]; if(!v) continue;
    out+=`<rect x="${padL+(d-1)*bw+1}" y="${y(v)}" width="${bw-2}" height="${H-padB-y(v)}" rx="2" fill="#E6DCC9"/>`; }
  // mes actual: rojo
  for(let d=1;d<=dias;d++){ const v=mapAct[d]; if(!v) continue;
    out+=`<rect x="${padL+(d-1)*bw+1}" y="${y(v)}" width="${bw-2}" height="${H-padB-y(v)}" rx="2" fill="${sel===d?'#7A0C12':'#B5121B'}"/>`; }
  // columnas invisibles para tocar
  for(let d=1;d<=dias;d++) out+=`<rect class="hit" data-d="${d}" x="${padL+(d-1)*bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>`;
  if(sel) out+=`<rect x="${padL+(sel-1)*bw}" y="${padT}" width="${bw}" height="${H-padT-padB}" fill="none" stroke="#7A0C12" stroke-width="1" rx="2"/>`;
  // eje
  for(let d=1;d<=dias;d+=5) out+=`<text x="${padL+(d-0.5)*bw}" y="${H-6}" font-size="11" fill="#7A6F66" text-anchor="middle">${d}</text>`;
  out+=`<text x="${padL}" y="10" font-size="10" fill="#7A6F66">máx ${mxnC(max)}</text></svg>`;
  return out;
}

  out+=`<polygon points="${[...up,...dn].join(' ')}" fill="#2E7D32" fill-opacity=".10"/>`;
  out+=`<polyline points="${path(c)}" fill="none" stroke="#C9A96E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  out+=`<polyline points="${path(v)}" fill="none" stroke="#B5121B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  v.forEach((k,i)=>{ if(k==null) return; const col=meses[i].parcial?'#2E7D32':'#B5121B';
    out+=`<circle cx="${x(i)}" cy="${y(k)}" r="4" fill="${col}"/><text x="${x(i)}" y="${y(k)-9}" font-size="9.5" font-weight="700" fill="${col}" text-anchor="middle">${f(k)}</text>`; });
  c.forEach((k,i)=>{ if(k==null) return;
    out+=`<circle cx="${x(i)}" cy="${y(k)}" r="3.5" fill="#C9A96E"/><text x="${x(i)}" y="${y(k)+16}" font-size="9.5" font-weight="700" fill="#9A7A3A" text-anchor="middle">${f(k)}</text>`; });
  return out+'</svg>';
}
let mesSel=null;
function vMes(){
  const md=(D.mesesDetalle||D.meses||[]).slice(); // ascendente
  const ult13=md.slice(-13);
  const y=D.ytd;
  const desc=md.slice().reverse();
  const act=desc[0]; if(!mesSel) mesSel=act.mes;
  // tabla
  const filas=desc.slice(0,13).map(m=>{
    const prev=md[md.indexOf(m)-1];
    const dm=prev?delta(m.venta,prev.venta,{small:true}):'<span class="delta eq sm">—</span>';
    const da=m.ventaAnioAnt?delta(m.venta,m.ventaAnioAnt,{small:true}):'<span class="delta eq sm">—</span>';
    return `<div class="m" data-m="${m.mes}">
      <div class="n"><b>${fmtMesCorto(m.mes)}</b><span>${m.diasConVenta} días${m.parcial?' · <span class="parcial">PARCIAL</span>':''}</span></div>
      <div class="v"><b class="num">${mxnC(m.venta)}</b><span class="num">${fNum.format(Math.round(m.kg/1000))} t · ${pct(m.margenPct)}</span></div>
      <div class="c">${dm}${da}</div>
    </div>
    <div class="det" data-det="${m.mes}" style="display:none"><div class="d2">
      <div><b class="num" style="color:#C62828">${mxnC(m.costo)}</b><span>costo de venta</span></div>
      <div><b class="num" style="color:var(--verde)">${mxnC(m.margen)}</b><span>margen bruto</span></div>
      <div><b class="num">${mxnC(m.promedioDiario)}</b><span>promedio por día de venta</span></div>
      <div><b class="num">${fNum.format(Math.round(m.pz))} pz</b><span>piezas</span></div>
      <div><b class="num">$${fNum1.format(m.precioKg||0)}</b><span>precio por kg</span></div>
      <div><b class="num">$${fNum1.format(m.costoKg||0)}</b><span>costo por kg</span></div>
      <div><b class="num" style="color:#C62828">${mxn(m.nc||0)}</b><span>notas de crédito</span></div>
      <div><b class="num">${m.ventaAnioAnt?mxnC(m.ventaAnioAnt):'—'}</b><span>venta ${MES3[Number(m.mes.slice(5))-1]} ${Number(m.mes.slice(0,4))-1}</span></div>
    </div></div>`;
  }).join('');
  // totales del año en curso (meses completos + parcial)
  const anio=act.mes.slice(0,4);
  const delAnio=md.filter(m=>m.mes.startsWith(anio));
  const tv=delAnio.reduce((s,m)=>s+m.venta,0), tk=delAnio.reduce((s,m)=>s+m.kg,0), tc=delAnio.reduce((s,m)=>s+m.costo,0);
  const ytdCard = y ? `
  <div class="card">
    <h2>Acumulado ${y.anio} · 1 ene – ${fecha(y.hasta).replace(/^\w+ /,'')}</h2>
    <div class="big num" style="font-size:30px">${mxn(y.actual.venta)}</div>
    <div style="margin:8px 0 12px">${delta(y.actual.venta,y.anterior.venta)} <span class="sub">vs. mismo periodo ${y.anterior.anio} (${mxnC(y.anterior.venta)})</span></div>
    <div class="ytd">
      <div class="kpi"><div class="v num">${fNum.format(Math.round(y.actual.kg/1000))} t</div><div class="l">kilos</div><div class="s">${y.anterior.anio}: ${fNum.format(Math.round(y.anterior.kg/1000))} t · ${delta(y.actual.kg,y.anterior.kg,{small:true})}</div></div>
      <div class="kpi"><div class="v num rojo">${mxnC(y.actual.costo)}</div><div class="l">costo de venta</div><div class="s">${y.anterior.anio}: ${mxnC(y.anterior.costo)}</div></div>
      <div class="kpi"><div class="v num verde">${mxnC(y.actual.margen)}</div><div class="l">margen bruto</div><div class="s">${y.anterior.anio}: ${mxnC(y.anterior.margen)} · ${delta(y.actual.margen,y.anterior.margen,{small:true})}</div></div>
      <div class="kpi"><div class="v num">${pct(y.actual.margenPct)}</div><div class="l">margen %</div><div class="s">${y.anterior.anio}: ${pct(y.anterior.margenPct)}</div></div>
    </div>
    ${y.datosAnioAnteriorCompletos?'':'<div class="tip">El comparativo del año anterior se completará conforme el histórico cargado cubra todo ese periodo.</div>'}
  </div>`:'';
  return `
  ${ytdCard}
  <div class="card">
    <h2>Venta por mes · ${anio} vs ${Number(anio)-1}</h2>
    ${barrasAnio(delAnio,'venta',{fmt:v=>'$'+fNum1.format(v/1e6)+'M',sel:mesSel})}
    <div class="leg"><span><i style="background:#B5121B"></i>${anio}</span><span><i style="background:#E6DCC9"></i>${Number(anio)-1}</span><span><i style="background:#2E7D32"></i>mes en curso (parcial)</span></div>
    <div id="mes-det">${detMes(delAnio.find(m=>m.mes===mesSel)||act, md)}</div>
    <div class="tip">Toca una barra para ver el detalle de ese mes.</div>
  </div>
  <div class="card">
    <h2>Kilos por mes · ${anio} vs ${Number(anio)-1}</h2>
    ${barrasAnio(delAnio,'kg',{alto:180,fmt:v=>fNum.format(Math.round(v/1000))+' t'})}
    <div class="leg"><span><i style="background:#B5121B"></i>${anio}</span><span><i style="background:#E6DCC9"></i>${Number(anio)-1}</span></div>
  </div>
  <div class="card">
    <h2>Venta neta vs costo de venta · ${anio}</h2>
    ${lineasVentaCosto(delAnio)}
    <div class="leg"><span><i style="background:#B5121B"></i>venta neta</span><span><i style="background:#C9A96E"></i>costo de venta</span><span><i style="background:#2E7D32;opacity:.35"></i>margen bruto</span></div>
    <div class="tip">La franja verde entre las dos líneas es el margen bruto en pesos de cada mes. Si las líneas se acercan, el margen se achica aunque la venta suba.</div>
  </div>
  <div class="card">
    <h2>Margen bruto % por mes · ${anio} vs ${Number(anio)-1}</h2>
    ${lineaMargen(delAnio)}
    <div class="leg"><span><i style="background:#B5121B"></i>${anio}</span><span><i style="background:#C9A96E"></i>${Number(anio)-1}</span><span><i style="background:#2E7D32"></i>mes en curso</span></div>
    <div class="tip">Margen bruto = venta neta menos costo de venta, como % de la venta. Si la línea roja va arriba de la beige, el mes se vendió con mejor margen que el año pasado. Los pesos de margen están en el detalle de cada mes.</div>
  </div>
  <div class="card">
    <h2>Venta diaria · ${mesNombre(D.mes.mes)} vs. ${mesNombre(D.mesAntCompleto.mes)}</h2>
    ${(()=>{ if(!diaSel){ const u=D.diario.filter(s=>s.venta).slice(-1)[0]; diaSel=u?u.dia:null; } return barras(D.diario, D.diarioMesAnt,{sel:diaSel}); })()}
    <div class="leg"><span><i style="background:#B5121B"></i>${mesNombre(D.mes.mes)}</span><span><i style="background:#E6DCC9"></i>${mesNombre(D.mesAntCompleto.mes)}</span></div>
    ${diaSel?`<div class="det" style="margin-top:8px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px"><b>Día ${diaSel}</b><span><b class="num" style="color:#B5121B">${mxn((D.diario.find(s=>s.dia===diaSel)||{}).venta||0)}</b> <span class="sub">${MES3[Number(D.mes.mes.slice(5))-1]}</span> &nbsp;·&nbsp; <b class="num" style="color:#9A7A3A">${mxn((D.diarioMesAnt.find(s=>s.dia===diaSel)||{}).venta||0)}</b> <span class="sub">${MES3[Number(D.mesAntCompleto.mes.slice(5))-1]}</span></span></div>`:''}
    <div class="tip">Toca un día para ver sus cifras.</div>
  </div>`;
}
function selectorMes(id, sel, meses){
  const i=meses.indexOf(sel);
  return `<div class="selmes">
    <button id="${id}-prev" ${i<=0?'disabled':''}>‹</button>
    <select id="${id}-sel">${meses.slice().reverse().map(m=>`<option value="${m}" ${m===sel?'selected':''}>${mesNombre(m)}${m===D.mes.mes?' (en curso)':''}</option>`).join('')}</select>
    <button id="${id}-next" ${i===meses.length-1?'disabled':''}>›</button>
  </div>`;
}
function wireSelector(id, meses, getSel, setSel, rerender){
  const sel=document.getElementById(id+'-sel'); if(!sel) return;
  const go=m=>{ setSel(m); rerender(); window.scrollTo({top:0}); };
  sel.onchange=()=>go(sel.value);
  const i=meses.indexOf(getSel());
  document.getElementById(id+'-prev').onclick=()=>go(meses[i-1]);
  document.getElementById(id+'-next').onclick=()=>go(meses[i+1]);
}
function ymAnt(ym){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-2,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function mesAntDe(ym){ const a=ymAnt(ym); return MES3[Number(a.slice(5))-1]+' '+a.slice(0,4); }
function mesCortoAnio(ym){ return MES3[Number(ym.slice(5))-1]+' '+ym.slice(0,4); }
function movClientes(mv, ym, vs){
  if(!mv) return '';
  const act=mesCortoAnio(ym), ant=mesCortoAnio(ymAnt(ym));
  const fila=(r,col)=>`<li style="grid-template-columns:1fr auto"><div class="nm"><b>${esc(r.nombre)}</b><span>${ant}: ${mxnC(r.ventaMesAnt)} → ${mxnC(r.venta)}</span></div><div class="amt"><b class="num" style="color:${col}">${r.dif>0?'+':'−'}${mxnC(Math.abs(r.dif))}</b>${r.ventaMesAnt?`<span class="vs">${delta(r.venta,r.ventaMesAnt,{small:true})} <em>vs ${ant}</em></span>`:''}</div></li>`;
  const bloque=(tit,arr,col)=>`<h3 style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:${col};margin:14px 0 2px">${tit}</h3>${arr.length?`<ul class="list">${arr.map(r=>fila(r,col)).join('')}</ul>`:'<div class="empty" style="padding:8px 0">Ninguno</div>'}`;
  return `<div class="card">
    <h2>Quién sube y quién baja · ${mesNombre(ym)}</h2>
    <div class="tip" style="margin-top:0">Diferencia en pesos contra ${mesNombre(ymAnt(ym))}, entre todos los clientes.</div>
    ${bloque('▲ Los que más subieron', mv.suben, 'var(--verde)')}
    ${bloque('▼ Los que más bajaron', mv.bajan, '#C62828')}
    ${bloque('Compraron en '+ant+' y no en '+act, mv.sinCompra, 'var(--gris)')}
    ${mv.nuevos&&mv.nuevos.length?bloque('Nuevos en '+act+' (no compraron en '+ant+')', mv.nuevos, 'var(--verde)'):''}
  </div>`;
}
let cliMesSel=null;
function vCli(){
  const pm=D.productosPorMes||{}; const meses=Object.keys(pm).filter(m=>pm[m].clientes).sort();
  if(!meses.length){ // compatibilidad con datos viejos
    const total=D.mes.venta;
    return `<div class="card"><h2>Top 10 clientes · ${mesNombre(D.mes.mes)}</h2>${lista(D.clientes,{sub:'fam',total})}</div><div class="card"><h2>Por canal</h2>${lista(D.canales,{sub:'margen',total})}</div>`;
  }
  if(!cliMesSel||!pm[cliMesSel]) cliMesSel=meses[meses.length-1];
  const d=pm[cliMesSel], total=d.venta, vs=mesAntDe(cliMesSel);
  const bajaron=d.clientes.filter(c=>c.ventaMesAnt && c.venta<c.ventaMesAnt*0.85);
  return `
  ${selectorMes('cm', cliMesSel, meses)}
  <div class="card">
    <h2>Top 10 clientes · ${mesNombre(cliMesSel)}</h2>
    ${lista(d.clientes,{sub:'fam',total,vs})}
    ${bajaron.length?`<div class="alert">⚠️ <div><b>Bajaron más de 15 % vs ${vs}:</b> ${bajaron.map(c=>esc(c.nombre)).join(', ')}</div></div>`:''}
  </div>
  ${movClientes(d.movClientes, cliMesSel, vs)}`;
}
function wireCli(){
  const pm=D.productosPorMes||{}; const meses=Object.keys(pm).filter(m=>pm[m].clientes).sort();
  wireSelector('cm', meses, ()=>cliMesSel, m=>cliMesSel=m, ()=>{ document.getElementById('v-cli').innerHTML=vCli(); wireCli(); });
}
let prodMesSel=null;
function vProd(){
  const pm=D.productosPorMes||{}; const meses=Object.keys(pm).sort();
  if(!meses.length) return '<div class="card"><div class="empty">Sin datos por mes</div></div>';
  if(!prodMesSel||!pm[prodMesSel]) prodMesSel=meses[meses.length-1];
  const i=meses.indexOf(prodMesSel); const d=pm[prodMesSel];
  const totalFam=d.familias.reduce((s,f)=>s+f.venta,0);
  const esActual=prodMesSel===D.mes.mes;
  const mesAntSel=mesAntDe(prodMesSel);
  return `
  <div class="selmes">
    <button id="pm-prev" ${i===0?'disabled':''}>‹</button>
    <select id="pm-sel">${meses.slice().reverse().map(m=>`<option value="${m}" ${m===prodMesSel?'selected':''}>${mesNombre(m)}${m===D.mes.mes?' (en curso)':''}</option>`).join('')}</select>
    <button id="pm-next" ${i===meses.length-1?'disabled':''}>›</button>
  </div>
  <div class="card">
    <h2>Por familia de queso · ${mesNombre(prodMesSel)}</h2>
    ${lista(d.familias,{sub:'fam',total:totalFam,vs:mesAntSel})}
    ${Math.abs(totalFam-d.venta)>1?`<div class="tip" style="border-top:1px solid var(--linea);padding-top:8px;margin-top:4px">Venta de producto <b class="num">${mxnC(totalFam)}</b> · descuentos y NC sin producto <b class="num">${mxnC(d.venta-totalFam)}</b> · <b>venta neta del mes ${mxnC(d.venta)}</b></div>`:''}
  </div>
  <div class="card">
    <h2>Top 10 productos · ${mesNombre(prodMesSel)}</h2>
    ${lista(d.productos,{sub:'prod',vs:mesAntSel})}
  </div>`;
}
function detMes(m, md){
  if(!m) return '';
  const prev=md[md.indexOf(m)-1];
  const dm=prev?delta(m.venta,prev.venta,{small:true}):'';
  const da=m.ventaAnioAnt?delta(m.venta,m.ventaAnioAnt,{small:true}):'';
  return `<div class="det" style="margin-top:10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><b style="font-size:16px">${mesNombre(m.mes)}${m.parcial?' <span class="parcial">PARCIAL · '+m.diasConVenta+' días</span>':''}</b><b class="num" style="font-size:18px">${mxn(m.venta)}</b></div>
    <div style="font-size:12px;color:var(--gris);margin-bottom:10px">${dm} vs ${prev?MES3[Number(prev.mes.slice(5))-1]:''} &nbsp; ${da} vs ${MES3[Number(m.mes.slice(5))-1]} ${Number(m.mes.slice(0,4))-1}${m.ventaAnioAnt?' ('+mxnC(m.ventaAnioAnt)+')':''}</div>
    <div class="d2">
      <div><b class="num">${fNum.format(Math.round(m.kg))} kg</b><span>kilos</span></div>
      <div><b class="num">${mxnC(m.promedioDiario)}</b><span>promedio por día de venta (${m.diasConVenta} días)</span></div>
      <div><b class="num" style="color:#C62828">${mxnC(m.costo)}</b><span>costo de venta</span></div>
      <div><b class="num" style="color:var(--verde)">${mxnC(m.margen)} · ${pct(m.margenPct)}</b><span>margen bruto</span></div>
    </div></div>`;
}
function wireMes(){
  document.querySelectorAll('#v-mes rect.hit').forEach(r=>r.onclick=()=>{ diaSel=Number(r.dataset.d); document.getElementById('v-mes').innerHTML=vMes(); wireMes(); });
  document.querySelectorAll('#v-mes rect.barra').forEach(r=>r.onclick=()=>{ mesSel=r.dataset.m; document.getElementById('v-mes').innerHTML=vMes(); wireMes(); });
}
function wireProd(){
  const sel=document.getElementById('pm-sel'); if(!sel) return;
  const meses=Object.keys(D.productosPorMes||{}).sort();
  const go=m=>{ prodMesSel=m; document.getElementById('v-prod').innerHTML=vProd(); wireProd(); window.scrollTo({top:0}); };
  sel.onchange=()=>go(sel.value);
  const i=meses.indexOf(prodMesSel);
  document.getElementById('pm-prev').onclick=()=>go(meses[i-1]);
  document.getElementById('pm-next').onclick=()=>go(meses[i+1]);
}
function vEq(){
  const total=D.mes.venta;
  const nc=D.notasCredito||[];
  const ncTotal=nc.reduce((s,n)=>s+n.monto,0);
  return `
  <div class="card">
    <h2>Por vendedor · ${mesNombre(D.mes.mes)}</h2>
    ${lista(D.vendedores,{sub:'margen',total})}
  </div>
  <div class="card">
    <h2>Por ruta</h2>
    ${lista(D.rutas,{sub:'kgsolo'})}
  </div>
  <div class="card">
    <h2>Notas de crédito del mes</h2>
    <div class="med num" style="color:#C62828">${mxn(ncTotal)}</div>
    <div class="sub">${pct(total?ncTotal/(total+ncTotal):null)} de la venta bruta</div>
    ${nc.length?`<ul class="list">${nc.map(n=>`<li><div class="nm"><b>${esc(n.tipo)}</b><span>${n.documentos} doc. · ${kg(n.kg)}</span></div><div class="amt"><b class="num">${mxnC(n.monto)}</b></div></li>`).join('')}</ul>`:'<div class="empty">Sin notas de crédito</div>'}
    <div style="margin-top:10px"><span class="chip">Degustación: ${kg(D.mes.degustacionKg)}</span>${D.mes.lineasSinCosto?`<span class="chip">⚠️ ${D.mes.lineasSinCosto} líneas sin costo</span>`:''}</div>
  </div>`;
}

function render(){
  document.getElementById('upd').innerHTML=`Actualizado<br><b>${esc(D.generado)}</b>`;
  document.getElementById('v-hoy').innerHTML=vHoy();
  document.getElementById('v-mes').innerHTML=vMes(); wireMes();
  document.getElementById('v-prod').innerHTML=vProd(); wireProd();
  document.getElementById('v-cli').innerHTML=vCli(); wireCli();
  document.getElementById('v-eq').innerHTML=vEq();
}

// service worker (solo si está servido por https o localhost)
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
